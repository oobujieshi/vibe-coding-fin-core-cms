services:
  # ========== MySQL 8.0 ==========
  mysql:
    image: mysql:8.0.41
    container_name: fincore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fincore}
      MYSQL_USER: ${MYSQL_USER:-fincore}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fincore123}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Redis 7.x ==========
  redis:
    image: redis:7.4-alpine
    container_name: fincore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123456}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123456}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========== RabbitMQ 3.12 ==========
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: fincore-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fincore}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-fincore123}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Nacos 2.3 ==========
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: fincore-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: fincore
      NACOS_AUTH_IDENTITY_VALUE: fincore
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    depends_on:
      mysql:
        condition: service_healthy

  # ========== MinIO ==========
  minio:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    container_name: fincore-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:-admin123456}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
    name: fincore-mysql-data
  redis-data:
    name: fincore-redis-data
  rabbitmq-data:
    name: fincore-rabbitmq-data
  nacos-data:
    name: fincore-nacos-data
  minio-data:
    name: fincore-minio-data
